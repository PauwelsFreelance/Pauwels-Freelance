name: Notion Backup

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # 4x/day: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}           # lets you trigger it manually from the Actions tab ("Run workflow")

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Zip repository
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ZIP_NAME="${REPO_NAME}-${SHORT_SHA}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          zip -r "$ZIP_NAME" . -x ".git/*"

      - name: Upload zip to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: |
          set -e

          FILE_SIZE_BYTES=$(stat -c%s "$ZIP_NAME")
          FILE_SIZE_KB=$(( (FILE_SIZE_BYTES + 1023) / 1024 ))
          COMMIT_SHA="${GITHUB_SHA}"
          BRANCH="${GITHUB_REF##*/}"
          ACTOR="${GITHUB_ACTOR}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 1. Create a File Upload object
          CREATE_RESPONSE=$(curl -s -X POST "https://api.notion.com/v1/file_uploads" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: ${NOTION_VERSION}" \
            -H "Content-Type: application/json" \
            -d "{\"filename\": \"${ZIP_NAME}\", \"content_type\": \"application/zip\"}")

          FILE_UPLOAD_ID=$(echo "$CREATE_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          UPLOAD_URL="https://api.notion.com/v1/file_uploads/${FILE_UPLOAD_ID}/send"

          if [ -z "$FILE_UPLOAD_ID" ]; then
            echo "Failed to create file upload: $CREATE_RESPONSE"
            exit 1
          fi

          # 2. Send the file content
          curl -s -X POST "$UPLOAD_URL" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: ${NOTION_VERSION}" \
            -F "file=@${ZIP_NAME};type=application/zip"

          # 3. Create the database page, attaching the uploaded file
          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: ${NOTION_VERSION}" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": { \"type\": \"data_source_id\", \"data_source_id\": \"${NOTION_DATABASE_ID}\" },
              \"properties\": {
                \"Name\": { \"title\": [{ \"text\": { \"content\": \"${ZIP_NAME}\" } }] },
                \"Backup Date\": { \"date\": { \"start\": \"${NOW}\" } },
                \"Commit SHA\": { \"rich_text\": [{ \"text\": { \"content\": \"${COMMIT_SHA}\" } }] },
                \"Branch\": { \"rich_text\": [{ \"text\": { \"content\": \"${BRANCH}\" } }] },
                \"Size\": { \"rich_text\": [{ \"text\": { \"content\": \"${FILE_SIZE_KB} KB\" } }] },
                \"Triggered By\": { \"rich_text\": [{ \"text\": { \"content\": \"${ACTOR}\" } }] },
                \"Zip File\": { \"files\": [{ \"type\": \"file_upload\", \"file_upload\": { \"id\": \"${FILE_UPLOAD_ID}\" }, \"name\": \"${ZIP_NAME}\" }] }
              }
            }"
